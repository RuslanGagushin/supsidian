"$schema" = "schemas/schema.json"

[default]
description = "Pick a vault folder, then list, read, write and delete files inside it, and sync it with a git remote."
permissions = [
  "allow-pick",
  "allow-list",
  "allow-read",
  "allow-write",
  "allow-remove",
  "allow-remove-dir",
  "allow-list-dir",
  "allow-exists",
  "allow-git-sync",
  "allow-git-info",
]
