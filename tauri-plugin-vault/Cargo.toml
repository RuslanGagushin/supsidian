[package]
name = "tauri-plugin-vault"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-vault"
description = "Pick an Obsidian vault folder and read/write files in it (desktop: std::fs, Android: Storage Access Framework)"
publish = false

[dependencies]
tauri = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2.8"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
