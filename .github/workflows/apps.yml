# Builds the Supsidian apps on GitHub's machines.
# Works both in the full supsidian repository (app/ + standalone/) and in a repository that holds only the app folder.
#  - Run it by hand: Actions → "Build apps" → Run workflow. The files appear under the run's "Artifacts".
#  - Push a tag like v0.1.0 and the same files are also attached to a GitHub Release.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the app folder
        shell: bash
        run: if [ -d app/src-tauri ]; then echo "APP=app" >> "$GITHUB_ENV"; else echo "APP=." >> "$GITHUB_ENV"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP }}/src-tauri -> target
      - name: Install page dependencies
        if: hashFiles('standalone/package-lock.json') != ''
        working-directory: standalone
        run: npm ci
      - name: Install app tools
        working-directory: ${{ env.APP }}
        run: npm ci
      - name: Build Windows installers
        working-directory: ${{ env.APP }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Supsidian-Windows
          path: |
            ${{ env.APP }}/src-tauri/target/release/bundle/msi/*.msi
            ${{ env.APP }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find the app folder
        shell: bash
        run: if [ -d app/src-tauri ]; then echo "APP=app" >> "$GITHUB_ENV"; else echo "APP=." >> "$GITHUB_ENV"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP }}/src-tauri -> target
      - if: hashFiles('standalone/package-lock.json') != ''
        working-directory: standalone
        run: npm ci
      - working-directory: ${{ env.APP }}
        run: npm ci
      - name: Build universal app (Apple Silicon + Intel)
        working-directory: ${{ env.APP }}
        run: npm run tauri build -- --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: Supsidian-macOS
          path: ${{ env.APP }}/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - name: Find the app folder
        shell: bash
        run: if [ -d app/src-tauri ]; then echo "APP=app" >> "$GITHUB_ENV"; else echo "APP=." >> "$GITHUB_ENV"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK parts
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP }}/src-tauri -> target
      - if: hashFiles('standalone/package-lock.json') != ''
        working-directory: standalone
        run: npm ci
      - working-directory: ${{ env.APP }}
        run: npm ci
      - name: Create the Android project
        working-directory: ${{ env.APP }}
        run: |
          npx tauri android init --ci
          npx tauri icon icon.png
      # Optional: add these repository secrets to get a signed release APK that you can update later
      #   ANDROID_KEYSTORE_BASE64  — base64 of a .jks file (scripts/android-signing.mjs makes one)
      #   ANDROID_KEY_PASSWORD     — its password (key alias must be "supsidian")
      # Without them you get a debug APK, which installs fine on your own phone.
      - name: Signing key
        id: sign
        working-directory: ${{ env.APP }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > src-tauri/gen/android/supsidian.jks
            printf 'password=%s\nkeyAlias=supsidian\nstoreFile=%s\n' "$KEY_PASSWORD" "$PWD/src-tauri/gen/android/supsidian.jks" > src-tauri/gen/android/keystore.properties
            node scripts/android-signing.mjs
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release APK
        if: steps.sign.outputs.signed == 'true'
        working-directory: ${{ env.APP }}
        run: npx tauri android build --apk --target aarch64
      - name: Build debug APK
        if: steps.sign.outputs.signed != 'true'
        working-directory: ${{ env.APP }}
        run: npx tauri android build --apk --debug --target aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: Supsidian-Android
          path: ${{ env.APP }}/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*
          generate_release_notes: true
