# Runs the tests on every push and pull request:
#  - page: tests/*.test.mjs, the real page in headless Chrome (ubuntu-latest has Chrome; playwright-core drives it, nothing is downloaded)
#  - plugin: cargo test for tauri-plugin-vault (desktop file access, git sync)
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-vault -> target
      - run: cargo test --manifest-path tauri-plugin-vault/Cargo.toml
