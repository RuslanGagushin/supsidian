[package]
name = "supsidian"
version = "0.5.2"
description = "Supsidian — a card board and Org-style agenda for Obsidian vaults"
edition = "2021"
publish = false

[lib]
name = "supsidian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-vault = { path = "../tauri-plugin-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
